name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check formatting with Black
        run: |
          pip install -r requirements-dev.txt
          black --check src/ tests/
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .
      - name: Verificar uso de PySide6
        run: bash scripts/verificar-pyside6.sh

  test:
    name: Test (pytest)
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar bibliotecas de Qt en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Verificar ubicación de tests
        run: bash scripts/verificar-tests-ubicacion.sh
      - name: Run pytest
        run: pytest -m "not slow" --cov=src/escuadra --cov-report=term-missing
      - name: Verificar distribucion instalable
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "from chuspacalc.core.carrera import Carrera; from escuadra.core.carrera import Carrera as Anterior; assert Carrera is Anterior"
  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run mypy
        run: mypy src/escuadra src/chuspacalc

  changelog-check:
    name: Changelog check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for skip-changelog label
        id: check-label
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "skip-changelog"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "PR has 'skip-changelog' label, skipping changelog check"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if src/chuspacalc was modified
        id: check-src
        if: steps.check-label.outputs.skip == 'false'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^src/chuspacalc/" && echo "modified=true" >> $GITHUB_OUTPUT || echo "modified=false" >> $GITHUB_OUTPUT
      - name: Check if CHANGELOG.md was modified
        id: check-changelog
        if: steps.check-src.outputs.modified == 'true'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^CHANGELOG.md" && echo "modified=true" >> $GITHUB_OUTPUT || echo "modified=false" >> $GITHUB_OUTPUT
      - name: Fail if CHANGELOG.md not updated
        if: steps.check-changelog.outputs.modified == 'false'
        run: |
          echo "ERROR: Este PR modifica archivos en src/chuspacalc/ pero no actualiza CHANGELOG.md"
          echo "Por favor, actualiza CHANGELOG.md para documentar los cambios realizados."
          echo "Si este cambio no requiere actualización del changelog, agrega la etiqueta 'skip-changelog' al PR."
          exit 1
